name: KisanSetu CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; else pip install -r kisansetu/backend/requirements.txt; fi

      - name: Run pytest
        run: |
          if [ -f backend/test_main.py ]; then pytest backend/test_main.py -v; else pytest kisansetu/backend/test_main.py -v; fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          if [ -d frontend ]; then cd frontend && npm ci; else cd kisansetu/frontend && npm ci; fi

      - name: Build frontend
        run: |
          if [ -d frontend ]; then cd frontend && npm run build; else cd kisansetu/frontend && npm run build; fi
